plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:$rootProject.rei_version") { transitive false }
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    def props = [
            version    : project.version,
            description: rootProject.mod_description,
            project_url: rootProject.project_url,
            docs_url   : rootProject.docs_url,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// The dev-shadow jar is a build intermediate: keep it out of the published component.
components.java.withVariantsFromConfiguration(configurations.shadowRuntimeElements) { skip() }

// The common code is shaded into this jar, so its sources belong in the sources jar too.
sourcesJar {
    def commonSources = project(':common').tasks.named('sourcesJar')
    dependsOn commonSources
    from commonSources.map { zipTree(it.archiveFile) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
